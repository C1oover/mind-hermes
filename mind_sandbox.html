const sig=x=>1/(1+Math.exp(-Math.max(-30,Math.min(30,x))));
const clip=(x,a=0,b=1)=>x<a?a:(x>b?b:x);
const pos=x=>x>0?x:0, sgn=x=>x>0?1:(x<0?-1:0);

function defaultParams(){const P={};for(const r of PARAM_DEFS)P[r[0]]=r[2];return P;}
function ctlP(P,v){return {comfort:P['ctl_'+v+'_comfort'],drain:P['ctl_'+v+'_drain'],rec:P['ctl_'+v+'_rec'],rebound:P['ctl_'+v+'_rebound'],shield:P['ctl_'+v+'_shield'],deriv:P['ctl_'+v+'_deriv']};}

  constructor(P){this.P=P;this.lat=P.lat*Math.PI/180;}
  at(t){const P=this.P,hour=(t/60)%24,doy=P.start_doy+Math.floor(t/1440);

}

};
const PERSONA_KEYS=Object.keys(TRAITS);
function defaultPersona(){const q={};for(const k of PERSONA_KEYS)q[k]=0;return q;}
function personaPatch(persona){const out={};
  for(const name of PERSONA_KEYS){const t=TRAITS[name],raw=Math.max(-1,Math.min(1,+persona[name]||0));if(!raw)continue;
    for(const [k,g,c] of t.fx){const v=CURVES[c||t.curve](raw)*g;if(!v)continue;
      if(FLOOR_KEYS.has(k))out[k]=Math.max(out[k]||0,Math.max(0,v));
      else out[k]=(out[k]||0)+v;}}
  return out;}
function effectiveParams(P,persona){const E=Object.assign({},P),pp=personaPatch(persona);
  for(const k in pp){if(!(k in E))continue;const v=pp[k];
    if(FLOOR_KEYS.has(k))E[k]=Math.max(E[k],v);
    else if(MUL_KEYS.has(k))E[k]=E[k]*Math.exp(v);
    else if(k==='cap_inh')E[k]=Math.max(.03,Math.min(E[k],1+v));
    else if(SIGNED_ADD.has(k))E[k]=E[k]+v;
    else E[k]=Math.max(0,E[k]+v);}
  return E;}

standards_met:['Standards met','Felt success against own standards: negative = guilt/shame, positive = pride.','Negative: apologises, over-checks.'],

self_esteem:['Self esteem','Very slow baseline that standards-met relaxes toward.','Resilience to criticism.'],
sleep_pressure:['Sleep pressure','Homeostatic tiredness: rises awake and under load, falls asleep.','Shorter, slower replies.'],

res_seeking:['Seeking reserve','Same controller for curiosity.','Low: loses interest.'],
res_play:['Play reserve','Same controller for playfulness.','Low: jokes run dry.'],

res_dominance:['Dominance reserve','Willpower-like reserve for control.','Low: gives in.'],

exploration:['Exploration (derived)','SEEKING x control x calm x rested.','Tries new approaches.'],

circadian:['Circadian drive','Body clock signal 0..1.','Time-of-day energy.'],
light:['Daylight','From latitude, date, hour and cloud cover.','Mood and fatigue input.'],
cycle_estrogen:['Cycle estrogen','Optional persona hormone curve.','Raises wanting, mood, arousal.'],

moon:['Moon window','Window before full moon.','Slightly slower sleep.']};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const GROUPS=[['Mood and arousal',['mood','arousal','dominance','stress','certainty']],['Drives',['seeking','play','boredom','missing_user','lust_wanting','lust_inhibition','desire_expressed']],['Body',['sleep_pressure','sleep_debt','circadian','light']],['Slow layer',['bond','competence','self_esteem','arousal_baseline','mood_baseline','standards_met']],['Reserves and strain',['res_arousal','res_seeking','res_play','res_wanting','res_dominance','strain_arousal','strain_mood']],['Derived states',['anxiety','fear','determination','frustration','exploration','tension','efficiency','task_commitment']]];
const COLS=['#5aa9ff','#ff8a5a','#7ddc8a','#ffd166','#c792ea','#ff6b9d','#4dd0c8','#b0bec5'];
const S={P:defaultParams(),persona:defaultPersona(),cfg:{days:7,seed:1,repeat:1,skip:0,jitter:10,lustGate:1,
 profiles:{work:{load:.6,gT:.8,gR:.1,turn:3,mg:.1,mw:.05,ep:.05,nov:.3,tools:.4,dem:.5},chat:{load:.2,gT:.1,gR:.6,turn:2,mg:.2,mw:.4,ep:.4,nov:.3,tools:0,dem:0}},
 sessions:[0,1,2,3,4].map(d=>({day:d,start:'09:00',end:'12:00',profile:'work',failp:''})).concat([0,1,2,3,4,5,6].map(d=>({day:d,start:'20:00',end:'22:30',profile:'chat',failp:''}))),events:[]},res:null};
let timer=null;

function run(){try{const E=effectiveParams(S.P,S.persona);S.res=simulate(S.cfg,E);renderCharts();renderTop();}catch(e){document.getElementById('top2').textContent='Error: '+e.message;console.error(e);}}
function showTab(n){for(const t of ['events','params','persona','io','gloss']){document.getElementById('tab-'+t).style.display=t===n?'block':'none';document.getElementById('btn-'+t).classList.toggle('on',t===n);}
 if(n==='io')renderIO();}
function renderEvents(){const c=S.cfg,pn=Object.keys(c.profiles);let h='<h4>RUN</h4><div class="row">';
 h+=`days <input class="s" type="number" value="${c.days}" onchange="S.cfg.days=Math.max(1,Math.min(60,+this.value||7));sched()"> seed <input class="s" type="number" value="${c.seed}" onchange="S.cfg.seed=+this.value||0;sched()"> repeat week <input type="checkbox" ${c.repeat?'checked':''} onchange="S.cfg.repeat=this.checked?1:0;sched()"></div>`;
 h+=`<div class="row">skip prob <input class="s" type="number" step=".05" value="${c.skip}" onchange="S.cfg.skip=+this.value||0;sched()"> jitter min <input class="s" type="number" value="${c.jitter}" onchange="S.cfg.jitter=+this.value||0;sched()"> LUST gate <input class="s" type="number" step=".1" value="${c.lustGate}" onchange="S.cfg.lustGate=+this.value;sched()"></div>`;
 h+='<h4>SESSION PROFILES</h4><table><tr><th></th>'+PROFILE_FIELDS.map(f=>`<th title="${esc(PCT[f[0]])}">${f[1]}</th>`).join('')+'<th></th></tr>';
 for(const n of pn){h+=`<tr><td>${esc(n)}</td>`+PROFILE_FIELDS.map(f=>`<td><input class="s" type="number" step=".05" value="${c.profiles[n][f[0]]}" onchange="S.cfg.profiles['${n}']['${f[0]}']=+this.value;sched()"></td>`).join('')+`<td><span class="x" onclick="delProfile('${n}')">x</span></td></tr>`;}
 h+='</table><div class="row"><input id="newprof" class="m" placeholder="new profile"><button onclick="addProfile()">add</button></div>';
 h+='<h4>WEEKLY SESSIONS</h4><table><tr><th>Day</th><th>Start</th><th>End</th><th>Profile</th><th title="Tool failure probability (blank = 0.15)">Fail p</th><th></th></tr>';
 c.sessions.forEach((s,i)=>{h+=`<tr><td><select onchange="S.cfg.sessions[${i}].day=+this.value;sched()">${DAYN.map((d,j)=>`<option value="${j}" ${+s.day===j?'selected':''}>${d}</option>`).join('')}</select></td><td><input class="s" value="${s.start}" onchange="S.cfg.sessions[${i}].start=this.value;sched()"></td><td><input class="s" value="${s.end}" onchange="S.cfg.sessions[${i}].end=this.value;sched()"></td><td><select onchange="S.cfg.sessions[${i}].profile=this.value;sched()">${pn.map(p=>`<option ${s.profile===p?'selected':''}>${esc(p)}</option>`).join('')}</select></td><td><input class="s" value="${s.failp}" onchange="S.cfg.sessions[${i}].failp=this.value;sched()"></td><td><span class="x" onclick="S.cfg.sessions.splice(${i},1);renderEvents();sched()">x</span></td></tr>`;});
 h+='</table><button onclick="S.cfg.sessions.push({day:0,start:\'14:00\',end:\'15:00\',profile:Object.keys(S.cfg.profiles)[0],failp:\'\'});renderEvents();sched()">add session</button>';
 h+='<h4>ONE-OFF EVENTS</h4><div class="hint">type code: '+Object.keys(CODES).join(', ')+'. Free: state name plus delta (e.g. mood, -3).</div><table><tr><th>Day</th><th>Time</th><th>Type</th><th>Name</th><th>Value</th><th></th></tr>';
 c.events.forEach((e,i)=>{h+=`<tr><td><input class="s" type="number" value="${e.day}" onchange="S.cfg.events[${i}].day=+this.value;sched()"></td><td><input class="s" value="${e.time}" onchange="S.cfg.events[${i}].time=this.value;sched()"></td><td><select onchange="S.cfg.events[${i}].type=this.value;sched()"><option ${e.type==='code'?'selected':''}>code</option><option ${e.type==='free'?'selected':''}>free</option></select></td><td><input class="m" value="${esc(e.name)}" onchange="S.cfg.events[${i}].name=this.value;sched()"></td><td><input class="s" type="number" step=".1" value="${e.value}" onchange="S.cfg.events[${i}].value=+this.value;sched()"></td><td><span class="x" onclick="S.cfg.events.splice(${i},1);renderEvents();sched()">x</span></td></tr>`;});
 h+='</table><button onclick="S.cfg.events.push({day:1,time:\'12:00\',type:\'code\',name:\'praise\',value:1});renderEvents();sched()">add event</button>';

function addProfile(){const n=document.getElementById('newprof').value.trim();if(!n||S.cfg.profiles[n])return;S.cfg.profiles[n]={load:.3,gT:.3,gR:.3,turn:3,mg:0,mw:0,ep:0,nov:.3,tools:0,dem:0};renderEvents();sched();}
function delProfile(n){if(Object.keys(S.cfg.profiles).length<2)return;delete S.cfg.profiles[n];S.cfg.sessions=S.cfg.sessions.filter(s=>s.profile!==n);renderEvents();sched();}
function renderParams(){const D=defaultParams(),by={};for(const r of PARAM_DEFS)(by[r[4]]=by[r[4]]||[]).push(r);let h='<div class="row"><button onclick="resetParams()">reset all</button></div>';
 for(const g in by){h+=`<details><summary title="${esc(GROUPS_T[g]||g)}">${esc(g)}</summary>`;for(const r of by[g]){const v=S.P[r[0]];h+=`<div class="prow" title="${esc(r[0]+' (default '+r[2]+')')}"><span>${esc(r[1])}</span><input class="m ${v!==r[2]?'chg':''}" type="number" step="${r[3]}" value="${v}" onchange="setP('${r[0]}',this.value,this)"></div>`;}h+='</details>';}
 document.getElementById('tab-params').innerHTML=h;}
const GROUPS_T={'Cross-timescale coupling':'Speed multipliers scale a whole layer; carry values write fast reactions into slower states.','Half-lives (min)':'Time for a deviation to halve. Larger = stickier.','Impulse sizes':'How strongly each appraisal channel pushes a state.','Conditioning':'Habituation and mood congruence.','Strain and spillover':'How sustained excursions and spikes leak into slow baselines.'};

 for(const k of PERSONA_KEYS){const t=TRAITS[k];if(t.group!==last){h+=`<div class="tgrp">${esc(t.group)}</div>`;last=t.group;}

function renderGloss(){let h='<table class="gl">';for(const k in VI)h+=`<tr><td><b>${esc(VI[k][0])}</b><br><span class="hint">${k}</span></td><td>${esc(VI[k][1])}<br><span class="hint">LLM: ${esc(VI[k][2])}</span></td></tr>`;document.getElementById('tab-gloss').innerHTML=h+'</table>';}

 for(const d of box.children){draw(d,r);legend(d,r.N-1);}}

function draw(d,r){const cv=d.querySelector('canvas'),dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
 const keys=d._keys,signed=keys.some(k=>SIGNED.has(k)),lo=signed?-1:0;const Y=v=>h-4-(v-lo)/(1-lo)*(h-8);
 c.fillStyle='#1b2332';for(let i=0;i<r.N;i++){if(r.pres[i*r.REC]){const x=i/r.N*w;c.fillRect(x,0,Math.max(1,w/r.N+.5),h);}}
 c.strokeStyle='#2a3344';c.lineWidth=1;for(let dd=0;dd<=r.W/1440;dd++){const x=dd*1440/r.REC/r.N*w;c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();}
 c.beginPath();c.moveTo(0,Y(0));c.lineTo(w,Y(0));c.stroke();
 keys.forEach((k,j)=>{const s=r.series[k];c.strokeStyle=COLS[j%COLS.length];c.lineWidth=1.2;c.beginPath();for(let i=0;i<r.N;i++){const x=i/r.N*w,y=Y(Math.max(lo,Math.min(1,s[i])));i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();});}
renderEvents();renderParams();renderPersona();renderGloss();showTab('events');run();
