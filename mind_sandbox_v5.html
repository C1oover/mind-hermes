Object.assign(PTIP,{tb_arousal:'Adds to the target of tonic arousal (latent units). Set by traits; also usable by hand.',tb_mood:'Adds to the mood target (latent units).',tb_dom:'Shifts the dominance target (logit).',tb_seek:'Shifts the SEEKING target (logit).',tb_play:'Shifts the PLAY target (logit).',tb_want:'Shifts the LUST wanting target (logit).',tb_inh:'Shifts the LUST inhibition target (logit).',tb_bond:'Shifts the bond set-point (logit). Positive = bond settles higher.',tb_comp:'Shifts the competence set-point (logit).',tb_self:'Shifts the self esteem set-point (logit).',imp_gain:'Multiplies every fast arousal and valence impulse. >1 = more dynamic, <1 = flatter.',lust_mul:'Multiplies the top-level LUST gate.',cyc_amp:'Amplitude of a spontaneous sinusoidal mood swing (latent units). 0 = off.',cyc_days:'Period of the spontaneous mood swing in days.',floor_bond:'Hard floor on bond every minute, regardless of history. 1 = about 0.995.',floor_comp:'Hard floor on competence.',floor_self:'Hard floor on self esteem.',floor_dom:'Hard floor on dominance.',floor_mood:'Hard floor on mood and mood baseline.',cap_inh:'Hard ceiling on LUST inhibition (1 = off).'});
GT['Trait hooks (advanced)']='Engine hooks the Personality tab writes to. Values here are your manual base; traits are added on top (biases add, multipliers multiply, floors take the maximum).';
function traitFxText(t){return t.fx.map(([k,g,c])=>k+' '+(g>0?'+':'')+g+(c?' ('+c+')':'')).join(', ');}
function setTraits(o){persona=defaultPersona();Object.assign(persona,o);renderPersona();run();}
function renderPersona(){const root=document.getElementById('tab-persona');root.innerHTML='';
  const presets={'neutral':{},'pleasant':{energy:.3,playful:.3,warmth:.3,curiosity:.2,optimism:.2},'manic':{depressive_manic:.8,dynamicity:.4,impulsivity:.4,naughty:.2},'depressive':{depressive_manic:-.8,dynamicity:-.3,patience:-.2,resilience:-.4},'moody':{moody:.9,mood_cycling:.4},'stoic':{dynamicity:-.7,emotional_stability:.7,horizon:.2},'enforced loyalty':{enforced_loyalty:1},'bipolar-ish':{depressive_manic:.2,mood_cycling:1,moody:.6}};
  root.append(el('div',{className:'row'},Object.keys(presets).map(n=>el('button',{on:{click:()=>setTraits(presets[n])}},n))));
  root.append(el('div',{className:'hint'},'Each trait runs -1..+1 (overrides 0..1). Traits do not overwrite the Parameters tab: they bias targets, scale speeds and impulses, add floors/caps, and are applied on top of your base values every run. Hover a row for the exact effects.'));
  let grp='';
  for(const k of PERSONA_KEYS){const t=TRAITS[k];if(t.group!==grp){grp=t.group;root.append(el('div',{className:'tgrp'},grp));}
    const ov=t.group==='Overrides',lo=t.curve==='pos'?0:-1;
    const num=el('input',{type:'number',min:lo,max:1,step:.05,value:persona[k]});
    const rng=el('input',{type:'range',min:lo,max:1,step:.05,value:persona[k]});
    const set=v=>{v=clip(parseFloat(v)||0,lo,1);persona[k]=v;num.value=v;rng.value=v;schedule();};
    rng.addEventListener('input',e=>set(e.target.value));num.addEventListener('change',e=>set(e.target.value));
    root.append(el('div',{className:'trait'+(ov?' ov':''),title:t.label+': '+t.help+' | Curve: '+t.curve+' | Effects at 1.0: '+traitFxText(t)},el('span',null,t.label),rng,num));}
  const sum=el('div',{className:'hint',id:'ppreview'});root.append(el('details',null,el('summary',null,'effective parameter changes'),sum));
  root.oninput=()=>setTimeout(()=>{const E=effectiveParams(P,persona),ch=[];for(const k in E)if(Math.abs(E[k]-P[k])>1e-9)ch.push(k+': '+(+P[k]).toFixed(3)+' -> '+(+E[k]).toFixed(3));sum.textContent=ch.length?ch.join(' | '):'none';},80);}
const MODULE_SCHEMA='mind-ode-module-v1';
function dlJSON(o,name){const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'})),download:name});document.body.append(a);a.click();a.remove();}
function exportObj(){const diff={};for(const r of PARAM_DEFS)if(P[r[0]]!==r[2])diff[r[0]]=P[r[0]];return {schema:MODULE_SCHEMA,kind:'designer',cfg,params:diff,persona:Object.fromEntries(Object.entries(persona).filter(([k,v])=>v)),effective_params:EP};}
function importText(txt){const o=JSON.parse(txt);
  if(o.kind==='module-log'||Array.isArray(o.events)&&!o.cfg){let n=0;for(const x of o.events||[]){const m=Math.max(0,+x.t_min||0);cfg.events.push({day:Math.floor(m/1440),time:hh(m%1440),type:x.type==='free'?'free':'code',name:String(x.name||''),value:+x.value||0});n++;}moduleLog=o.events||[];if(o.persona)Object.assign(persona,o.persona);alert('imported '+n+' module events');}
  else{if(o.cfg)cfg=Object.assign(defaultCfg(),o.cfg);P=Object.assign(defaultParams(),o.params||{});persona=Object.assign(defaultPersona(),o.persona||{});}
  renderAll();run();}
function renderIO(){const root=document.getElementById('tab-io');root.innerHTML='';
  const ta=el('textarea',{id:'iotext',rows:18,spellcheck:false});

function renderGloss(){const root=document.getElementById('tab-gloss');root.innerHTML='';
  root.append(el('div',{className:'hint'},'Three layers: FAST (minutes: reactions, traces), MID (hours: mood, arousal, drives), SLOW (days: bond, competence, baselines). Speed multipliers and carry values in Parameters > Cross-timescale coupling control how much each layer feeds the next.'));
  const t=el('table',{className:'gl'},el('tr',null,['variable','what it is','effect on the LLM'].map(h=>el('th',null,h))));
  for(const k in VI)t.append(el('tr',null,el('td',null,el('b',null,VI[k][0]),el('br'),k),el('td',null,VI[k][1]),el('td',null,VI[k][2])));
  root.append(t,el('h4',null,'EVENT CODES'),el('div',{className:'hint'},Object.keys(CODES).map(c=>c+' ('+CODE_TIPS[c]+'): '+JSON.stringify(CODES[c])).join('  |  ')));}
function downloadCSV(){if(!result)return;const ks=Object.keys(result.series);const lines=['minute,'+ks.join(',')];
  for(let i=0;i<result.N;i++)lines.push((i*result.REC)+','+ks.map(k=>result.series[k][i].toFixed(4)).join(','));
  const a=el('a',{href:URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'})),download:'mind_sim.csv'});document.body.append(a);a.click();a.remove();}
function applyPreset(n){
  const base=()=>{cfg=defaultCfg();P=defaultParams();};
  if(n==='default')base();
  else if(n.startsWith('no controller')){P.ctl_on=0;}
  else if(n.startsWith('fragile')){for(const v of CTRLV){P['ctl_'+v+'_drain']*=2;P['ctl_'+v+'_rebound']*=1.5;}}
  else if(n.startsWith('sturdy')){for(const v of CTRLV){P['ctl_'+v+'_drain']*=.5;P['ctl_'+v+'_rebound']*=.6;}}
  else if(n.startsWith('cycle')){P.cycle_alpha=1;cfg.days=29;}
  else if(n.startsWith('task marathon')){cfg.days=3;cfg.sessions=[{day:0,start:'07:00',end:'15:00',profile:'marathon',failp:''},{day:0,start:'15:00',end:'18:00',profile:'lunch',failp:''}];cfg.events=[];cfg.repeat=false;}
  else if(n==='crisis day'){cfg.days=6;cfg.repeat=false;cfg.sessions=[{day:2,start:'06:00',end:'20:00',profile:'marathon',failp:'0.4'}];cfg.events=[];for(let m=360;m<1200;m+=10)cfg.events.push({day:2,time:hh(m),type:'code',name:'danger',value:.6});}
  else if(n==='hammer test'){cfg.days=3;cfg.repeat=false;cfg.sessions=[];cfg.events=[];for(let i=0;i<8;i++)cfg.events.push({day:1,time:'10:0'+i,type:'free',name:'fatigue',value:7});for(let i=0;i<5;i++)cfg.events.push({day:1,time:'14:0'+i,type:'free',name:'arousal',value:5});}
  else return;
  renderAll();run();}

CH[3].s[0][1]='wanting (excitation)';
const CHIPS=[['mood','mood'],['arousal','arousal'],['dominance','dominance'],['certainty','certainty'],['standards_met','standards-met'],['task_commitment','task commitment'],['seeking','SEEKING'],['play','PLAY'],['boredom','boredom'],['lust_wanting','wanting'],['lust_inhibition','inhibition'],['bond','bond'],['missing_user','missing'],['competence','competence'],['sleep_pressure','sleep pressure'],['res_arousal','arousal reserve']];
const DER=[['anxiety','anxiety'],['determination','determination'],['exploration','exploration'],['missing_user','homesick'],['desire','desire']];
const LM=30,RM=6,TM=4,BM=14;
function buildCharts(){const root=document.getElementById('charts');root.innerHTML='';
  for(const c of CH){c.cv=el('canvas');c.cur=el('div',{className:'cur'});c.wrap=el('div',{className:'cw'},c.cv,c.cur);
    root.append(el('div',{className:'chart'},el('div',{className:'legend'},el('b',null,c.title),c.s.map(s=>el('span',{style:{color:s[2],cursor:'help'},title:vtip(s[0])},'\u2014 '+s[1]))),c.wrap));}}
function drawChart(c){if(!result)return;const cv=c.cv,w=cv.clientWidth,h=cv.clientHeight,dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const pw=w-LM-RM,ph=h-TM-BM,N=result.N,X=i=>LM+i/(N-1)*pw,Y=v=>TM+(1-(v-c.min)/(c.max-c.min))*ph;
  g.fillStyle='rgba(120,150,220,.10)';for(const [a,b] of result.bands)g.fillRect(X(a),TM,Math.max(1,X(b)-X(a)),ph);
  g.strokeStyle='#2a3140';g.fillStyle='#8a93a6';g.font='10px sans-serif';g.lineWidth=1;
  for(const v of [c.min,(c.min+c.max)/2,c.max]){g.beginPath();g.moveTo(LM,Y(v));g.lineTo(w-RM,Y(v));g.stroke();g.fillText(v.toFixed(1),2,Y(v)+3);}
  const per=1440/result.REC;for(let d=0;d<=Math.ceil(result.W/1440);d++){const x=X(Math.min(N-1,d*per));g.beginPath();g.moveTo(x,TM);g.lineTo(x,TM+ph);g.stroke();if(d<result.W/1440)g.fillText(DAYN[d%7],x+3,h-3);}
  for(const [k,,col] of c.s){const d=result.series[k];g.strokeStyle=col;g.lineWidth=1.2;g.beginPath();for(let i=0;i<N;i++){const x=X(i),y=Y(clip(d[i],c.min,c.max));if(i)g.lineTo(x,y);else g.moveTo(x,y);}g.stroke();}}
function drawAll(){for(const c of CH)drawChart(c);}
function fmtT(m){const d=Math.floor(m/1440),mm=Math.floor(m%1440);return DAYN[d%7]+' '+String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0');}
function chipHTML(list,i){return list.map(([k,l])=>'<span class="chip" title="'+vtipA(k)+'">'+l+' <b>'+result.series[k][i].toFixed(2)+'</b></span>').join('');}
function updateTop(i){if(!result)return;const m=i*result.REC,s=result.sess[Math.min(m,result.W-1)],o=result.series;
  document.getElementById('top1').innerHTML='<b>'+fmtT(m)+'</b> | session: '+(s>=0?result.names[s]:'none')+' | away '+(o.present[i]?'0.0':(result.away[i]/60).toFixed(1))+' h';
  document.getElementById('top2').innerHTML=chipHTML(CHIPS,i)+'<br>derived: '+chipHTML(DER,i);}
function setCursor(i){const N=result.N;for(const c of CH){const w=c.cv.clientWidth,pw=w-LM-RM;c.cur.style.display='block';c.cur.style.left=(LM+i/(N-1)*pw)+'px';}updateTop(i);}
function run(){EP=effectiveParams(P,persona);result=simulate(cfg,EP,5);
  const bands=[];let s=-1;for(let i=0;i<result.N;i++){const p=result.pres[Math.min(i*result.REC,result.W-1)];if(p&&s<0)s=i;if(!p&&s>=0){bands.push([s,i]);s=-1;}}if(s>=0)bands.push([s,result.N-1]);result.bands=bands;
  document.getElementById('info').textContent=result.W+' min simulated in '+result.ms+' ms, '+result.impMin+' impulse minutes | active traits: '+PERSONA_KEYS.filter(k=>Math.abs(persona[k])>.001).length;
  drawAll();updateTop(0);}
function renderAll(){renderEvents();renderParams();renderPersona();renderIO();renderGloss();}
function showTab(n){activeTab=n;for(const t of ['events','params','persona','io','gloss']){document.getElementById('tab-'+t).style.display=t===n?'block':'none';document.getElementById('btn-'+t).classList.toggle('on',t===n);}}
window.addEventListener('load',()=>{buildCharts();renderAll();showTab('events');
  const ch=document.getElementById('charts');ch.addEventListener('mousemove',e=>{const w=e.target.closest('.cw');if(!w||!result)return;const r=w.getBoundingClientRect(),f=clip((e.clientX-r.left-LM)/(r.width-LM-RM),0,1);setCursor(Math.round(f*(result.N-1)));});
  window.addEventListener('resize',drawAll);run();});
